<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crypto Grid</title>
<style>
:root{
  --bg:#0c0f14; --panel:#12161d; --line:#1e2530; --text:#d8dee9; --muted:#7d8797;
  --up:#26a69a; --down:#ef5350; --sel:#2f3d52;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%}

#topbar{display:flex;align-items:center;gap:16px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.01em}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;color:var(--muted);padding:5px 11px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--sel);color:var(--text)}
#hint{color:var(--muted);flex:1;min-width:180px}
.opts{display:flex;align-items:center;gap:8px}
.sw{width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:#fff}
select,input[type=text]{font:inherit}
#width{background:#0f1319;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:3px 4px}
label.chk{display:flex;align-items:center;gap:5px;color:var(--muted);cursor:pointer}

#main{flex:1;display:flex;min-height:0}
#tools{width:48px;display:flex;flex-direction:column;gap:6px;padding:8px 5px;background:var(--panel);border-right:1px solid var(--line)}
#tools button{width:38px;height:38px;display:grid;place-items:center;background:none;border:1px solid transparent;border-radius:7px;color:var(--muted);cursor:pointer}
#tools button:hover{color:var(--text);background:#181e28}
#tools button.on{color:#fff;background:var(--sel);border-color:#3b4c66}
#tools svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

#grid{flex:1;display:grid;gap:2px;background:var(--line);min-width:0;min-height:0}
.g1{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}
.g4{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.g6{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}

.panel{display:flex;flex-direction:column;background:var(--bg);min-width:0;min-height:0;box-shadow:inset 0 0 0 1px transparent}
.panel.active{box-shadow:inset 0 0 0 1px var(--sel)}
.phead{display:flex;align-items:center;gap:8px;padding:4px 8px;border-bottom:1px solid var(--line);min-width:0}
.sym{width:104px;background:#0f1319;border:1px solid var(--line);color:var(--text);border-radius:5px;padding:3px 7px;font:600 13px var(--mono);text-transform:uppercase}
.sym:focus{outline:none;border-color:#4a6283}
.ivs{display:flex;gap:1px}
.ivs button{background:none;border:0;color:var(--muted);padding:3px 6px;border-radius:4px;cursor:pointer}
.ivs button:hover{color:var(--text)}
.ivs button.on{background:var(--sel);color:var(--text)}
.last{margin-left:auto;font:600 13px var(--mono)}
.last.up{color:var(--up)} .last.down{color:var(--down)}
.clr{background:none;border:1px solid var(--line);color:var(--muted);border-radius:5px;padding:2px 8px;cursor:pointer}
.clr:hover{color:var(--text);border-color:#3b4c66}
.tbtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:5px;padding:3px 10px;cursor:pointer}
.tbtn:hover,.tbtn.on{color:var(--text);border-color:#3b4c66}
[hidden]{display:none !important}
.fsb{background:none;border:1px solid var(--line);color:var(--muted);border-radius:5px;padding:3px 6px;cursor:pointer;display:grid;place-items:center}
.fsb:hover{color:var(--text);border-color:#3b4c66}
.fsb svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#grid.solo{grid-template-columns:minmax(0,1fr) !important;grid-template-rows:minmax(0,1fr) !important}
#grid.solo .panel:not(.solo-panel){display:none}
#fibPanel{position:fixed;width:350px;background:var(--panel);border:1px solid #3b4c66;border-radius:8px;padding:12px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:8px}
#fibPanel .fp-title{font-weight:600}
#fibInput{background:#0f1319;border:1px solid var(--line);color:var(--text);border-radius:5px;padding:6px 8px;font:13px var(--mono);width:100%}
#fibInput:focus{outline:none;border-color:#4a6283}
.fp-ext{display:flex;gap:14px;align-items:center;color:var(--muted)}
.fp-ext .chk{color:var(--text)}
.fp-help{color:var(--muted);font-size:12px;line-height:1.4}
.fp-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fp-row button{background:#181e28;border:1px solid var(--line);border-radius:5px;padding:4px 9px;cursor:pointer}
.fp-row button:hover{border-color:#3b4c66}
.fp-row button.primary{margin-left:auto;background:var(--sel);border-color:#3b4c66;color:#fff}
.fp-err{color:#ff8a80;font-size:12px}
.mkt{background:none;border:1px solid var(--line);color:var(--muted);border-radius:5px;padding:2px 8px;cursor:pointer}
.mkt:hover{color:var(--text);border-color:#3b4c66}
.mkt.fut{background:#3a2f12;color:#f5c518;border-color:#6b5517}
.inv{background:none;border:1px solid var(--line);color:var(--muted);border-radius:5px;padding:2px 8px;cursor:pointer}
.inv:hover{color:var(--text);border-color:#3b4c66}
.inv.on{background:var(--sel);color:#fff;border-color:#3b4c66}

.pbody{position:relative;flex:1;min-height:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.pbody.tool-on,.pbody.tool-on *{touch-action:none !important}
button{touch-action:manipulation}
@media (pointer:coarse){
  .sym,#fibInput,#width{font-size:16px}
  #tools{width:54px}
  #tools button{width:44px;height:44px}
  .ivs button{padding:7px 8px}
  .mkt,.inv,.clr,.tbtn{padding:6px 10px}
  .seg button{padding:7px 13px}
}
.chart,.ov{position:absolute;inset:0}
.ov{width:100%;height:100%;pointer-events:none;z-index:10}
.msg{position:absolute;left:12px;top:10px;color:var(--muted);pointer-events:none;z-index:11}
.msg.err{color:#ff8a80}
.pbody.cur-cross,.pbody.cur-cross *{cursor:crosshair !important}
.pbody.cur-move,.pbody.cur-move *{cursor:move !important}
.pbody.cur-del,.pbody.cur-del *{cursor:pointer !important}

/* Cabecera de gráfica compacta en una sola fila */
.panel{container-type:inline-size}
.phead{flex-wrap:nowrap;gap:6px;padding:3px 6px}
.sym{width:84px}
.ivs button{padding:3px 5px;font-size:12px}
.mkt{padding:3px 7px}
.clr,.inv{display:grid;place-items:center;padding:3px 6px}
.clr svg,.inv svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.last{white-space:nowrap}
.ivsel{display:none;background:#0f1319;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:3px 4px;font:inherit}
@container (max-width:640px){
  .ivs{display:none}
  .ivsel{display:block}
}
@media (pointer:coarse){
  .phead{flex-wrap:wrap}
  .clr,.inv,.fsb{padding:7px 9px}
  .ivsel{font-size:16px}
}

/* Reordenar gráficas */
.grip{flex-shrink:0;width:12px;height:22px;display:grid;place-items:center;color:var(--muted);cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.grip:hover{color:var(--text)}
.grip svg{width:10px;height:16px;fill:currentColor}
#grid.g1 .grip,#grid.solo .grip{display:none}
.panel.dragging{opacity:.45}
html.dragging-panel,html.dragging-panel *{cursor:grabbing !important;-webkit-user-select:none !important;user-select:none !important}
#dropInd{position:fixed;z-index:100;width:4px;margin-left:-2px;background:#5b8def;border-radius:2px;pointer-events:none;display:none;box-shadow:0 0 8px rgba(91,141,239,.8)}
@media (pointer:coarse){.grip{width:22px;height:30px}}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">Crypto Grid</div>
    <div class="seg" id="layoutSeg">
      <button data-n="1">1</button><button data-n="2">2</button><button data-n="4">4</button><button data-n="6">6</button>
    </div>
    <div id="hint"></div>
    <div class="opts">
      <span id="swatches"></span>
      <select id="width" title="Grosor">
        <option value="1">1 px</option><option value="2">2 px</option><option value="3">3 px</option><option value="4">4 px</option><option value="6">6 px</option>
      </select>
      <label class="chk" title="Pega la línea al máximo, mínimo, apertura o cierre más cercano. Mantén Ctrl para invertirlo un momento."><input type="checkbox" id="magnet"> Imán</label>
      <button class="tbtn" id="fibBtn" title="Editar los niveles de Fibonacci">Niveles Fib</button>
    </div>
  </header>
  <div id="main">
    <aside id="tools">
      <button data-tool="cursor" title="Cursor (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 7-6 2-2 7z"/></svg></button>
      <button data-tool="h" title="Línea horizontal (H)"><svg viewBox="0 0 24 24"><path d="M3 12h18"/><circle cx="12" cy="12" r="2.2"/></svg></button>
      <button data-tool="fib" title="Fibonacci (F)"><svg viewBox="0 0 24 24"><path d="M3 5h18M3 10h18M3 15h18M3 20h18"/><path d="M6 19L18 6" stroke-dasharray="2 2.5"/></svg></button>
      <button data-tool="brush" title="Pincel (B)"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg></button>
      <button data-tool="eraser" title="Goma de borrar (E)"><svg viewBox="0 0 24 24"><path d="M8 20h11"/><path d="M5 15l9-9 5 5-6 6H9z"/></svg></button>
      <button id="hideBtn" title="Ocultar dibujos" style="margin-top:auto"></button>
    </aside>
    <section id="grid"></section>
  </div>
</div>
<datalist id="symlist"></datalist>
<datalist id="symlistF"></datalist>
<div id="fibPanel" hidden>
  <div class="fp-title">Niveles de Fibonacci</div>
  <input type="text" id="fibInput" spellcheck="false" autocomplete="off">
  <div class="fp-help">Separa los valores con espacios. Puedes usar negativos y mayores que 1 (extensiones). Se aplica a todos los Fibonacci.</div>
  <div class="fp-ext">
    <span>Extender líneas:</span>
    <label class="chk"><input type="checkbox" id="fibExtL"> Izquierda</label>
    <label class="chk"><input type="checkbox" id="fibExtR"> Derecha</label>
  </div>
  <div class="fp-row">
    <button data-preset="classic">Clásico</button>
    <button data-preset="quarters">Cuartos</button>
    <button data-preset="ext">Con extensiones</button>
    <span class="fp-err" id="fibErr"></span>
    <button class="primary" id="fibApply">Aplicar</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
(function(){
'use strict';
if(typeof LightweightCharts==='undefined'){
  document.body.innerHTML='<p style="padding:24px;font:14px system-ui;color:#d8dee9">No se pudo cargar la librería de gráficas. Comprueba tu conexión a internet y recarga la página.</p>';
  return;
}

/* ---------- Configuración ---------- */
const INTERVALS={'1m':60,'5m':300,'15m':900,'1h':3600,'4h':14400,'1d':86400,'1w':604800,'1M':2592000,'3M':7776000,'12M':31536000};
// Binance no ofrece 3 ni 12 meses: se construyen agrupando velas mensuales (trimestres y años naturales, UTC)
const AGG={'3M':3,'12M':12};
function groupStart(t,iv){
  const d=new Date(t*1000),y=d.getUTCFullYear(),m=d.getUTCMonth();
  const mm=AGG[iv]===12?0:Math.floor(m/3)*3;
  return Date.UTC(y,mm,1)/1000;
}
function aggregate(bars,iv){
  const out=[];let cur=null;
  for(const b of bars){
    const gs=groupStart(b.time,iv);
    if(cur&&cur.time===gs){cur.high=Math.max(cur.high,b.high);cur.low=Math.min(cur.low,b.low);cur.close=b.close;}
    else{cur={time:gs,open:b.open,high:b.high,low:b.low,close:b.close};out.push(cur);}
  }
  return out;
}
const REST=['https://api.binance.com','https://data-api.binance.vision'];
const REST_F='https://fapi.binance.com';
const WSS={
  spot:['wss://stream.binance.com:9443/ws','wss://data-stream.binance.vision/ws'],
  futures:['wss://fstream.binance.com/market/ws']
};
const FIB=[0,0.236,0.382,0.5,0.618,0.786,1];
const FIB_COLORS={0:'#9aa4b2',0.236:'#ef5350',0.382:'#ff9800',0.5:'#66bb6a',0.618:'#26a69a',0.786:'#42a5f5',1:'#9aa4b2'};
const SWATCHES=['#ffffff','#f5c518','#4da3ff','#ef5350','#26a69a','#d36bff'];
const FALLBACK_SYMBOLS=['BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT','XRPUSDT','DOGEUSDT','ADAUSDT','AVAXUSDT','LINKUSDT','TRXUSDT','DOTUSDT','LTCUSDT','BCHUSDT','NEARUSDT','UNIUSDT','ATOMUSDT','APTUSDT','ARBUSDT','OPUSDT','SUIUSDT','PEPEUSDT','SHIBUSDT','INJUSDT','FETUSDT','TONUSDT','HBARUSDT','AAVEUSDT','FILUSDT'];
const HINTS={
  cursor:'Arrastra para mover la gráfica. Arrastra un dibujo para moverlo.',
  h:'Haz clic donde quieras la línea. Con el imán se pega a máximos y mínimos (Ctrl lo invierte).',
  fib:'Haz clic en el punto inicial y luego en el final (o arrastra).',
  brush:'Mantén pulsado y dibuja. Esc para volver al cursor.',
  eraser:'Haz clic sobre un dibujo para borrarlo.'
};
const KEY='cryptoGrid.v1';
const BRUSH_SMOOTH_PASSES=2; // suavizado mínimo del pincel al soltar (0 = sin suavizado, 3-4 = más fuerte)
const ICON_EXPAND='<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const ICON_COLLAPSE='<svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';

/* ---------- Estado persistente ---------- */
const DEFAULT_PANELS=[
  {symbol:'BTCUSDT',interval:'15m'},{symbol:'ETHUSDT',interval:'15m'},{symbol:'SOLUSDT',interval:'15m'},
  {symbol:'BNBUSDT',interval:'15m'},{symbol:'XRPUSDT',interval:'1h'},{symbol:'DOGEUSDT',interval:'1h'}
];
function loadState(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY));
    if(s&&Array.isArray(s.panels)){
      const st=Object.assign({layout:4,drawings:{},color:'#f5c518',width:2,fibExt:false,fibExtL:false,magnet:true,fibLevels:FIB.slice()},s);
      while(st.panels.length<6) st.panels.push(Object.assign({},DEFAULT_PANELS[st.panels.length]));
      if(!st.drawings||typeof st.drawings!=='object') st.drawings={};
      if(!Array.isArray(st.fibLevels)||st.fibLevels.length<2||st.fibLevels.some(v=>typeof v!=='number'||!isFinite(v))) st.fibLevels=FIB.slice();
      return st;
    }
  }catch(e){}
  return {layout:window.innerWidth<700?1:4,panels:DEFAULT_PANELS.map(p=>Object.assign({},p)),drawings:{},color:'#f5c518',width:2,fibExt:false,fibExtL:false,magnet:true,fibLevels:FIB.slice()};
}
const state=loadState();
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}},150);
}
const drawingsOf=sym=>state.drawings[sym]||(state.drawings[sym]=[]);

/* ---------- Utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const gridEl=$('#grid');
const panels=[];
const live=()=>panels.filter(Boolean);
let tool='cursor';
let soloPanel=null;
let activePanel=null;

function invalidateAll(){live().forEach(p=>p.dirty=true);save();}
function addDrawing(sym,d){
  d.id=Math.random().toString(36).slice(2,9);
  drawingsOf(sym).push(d);
  invalidateAll();
}
function segDist(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
  let t=l2?((px-x1)*dx+(py-y1)*dy)/l2:0;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
}
function hexToRgba(hex,a){
  const n=parseInt(hex.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}
const FIB_PAL=['#ab47bc','#ffa726','#29b6f6','#9ccc65','#ec407a','#8d6e63','#26c6da'];
function fibColor(lv){
  if(FIB_COLORS[lv]) return FIB_COLORS[lv];
  return FIB_PAL[Math.abs(Math.round(lv*100))%FIB_PAL.length];
}
function textOn(hex){
  const n=parseInt(hex.slice(1),16);
  const lum=(0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))/255;
  return lum>0.6?'#0c0f14':'#ffffff';
}
function normalizeSymbol(raw){
  let s=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!s) return null;
  if(!/(USDT|USDC|FDUSD|BUSD|BTC|ETH|BNB|EUR|TRY)$/.test(s)||s.length<=4&&!/USDT$/.test(s)) s+='USDT';
  return s;
}
function setActive(p){
  activePanel=p;
  live().forEach(x=>x.root.classList.toggle('active',x===p));
}

/* ---------- Datos de Binance ---------- */
async function fetchKlines(symbol,interval,opts){
  opts=opts||{};
  const fut=opts.market==='futures';
  const bases=fut?[REST_F]:REST;
  const path=fut?'/fapi/v1/klines':'/api/v3/klines';
  let lastErr;
  for(const base of bases){
    try{
      let url=`${base}${path}?symbol=${symbol}&interval=${AGG[interval]?'1M':interval}&limit=${opts.limit||1000}`;
      if(opts.endTime) url+=`&endTime=${opts.endTime}`;
      const r=await fetch(url);
      if(r.status===400) throw Object.assign(new Error('Par no encontrado en '+(fut?'Futuros':'Spot')),{fatal:true,notFound:true});
      if(fut&&(r.status===451||r.status===403)) throw Object.assign(new Error('Binance bloquea los futuros desde tu conexión o ubicación'),{fatal:true});
      if(!r.ok) throw new Error('Error HTTP '+r.status);
      const j=await r.json();
      const rows=j.map(k=>({time:Math.floor(k[0]/1000),open:+k[1],high:+k[2],low:+k[3],close:+k[4]}));
      return AGG[interval]?aggregate(rows,interval):rows;
    }catch(e){
      if(e.fatal) throw e;
      lastErr=e;
    }
  }
  if(lastErr&&!(lastErr instanceof TypeError)) throw lastErr;
  throw new Error(fut?'No se pudo conectar con Binance Futuros (puede estar bloqueado en tu red)':'Sin conexión con Binance');
}
async function loadSymbols(){
  const fill=(sel,list)=>{$(sel).innerHTML=list.map(x=>`<option value="${x}">`).join('');};
  fill('#symlist',FALLBACK_SYMBOLS);
  fill('#symlistF',FALLBACK_SYMBOLS.concat(['1000PEPEUSDT','1000SHIBUSDT','1000BONKUSDT']));
  const grab=async(urls,sel)=>{
    for(const url of urls){
      try{
        const r=await fetch(url);
        if(!r.ok) continue;
        const j=await r.json();
        const list=j.filter(t=>/^[A-Z0-9]+USDT$/.test(t.symbol)&&!/(UP|DOWN)USDT$/.test(t.symbol))
          .sort((a,b)=>b.quoteVolume-a.quoteVolume).slice(0,250).map(t=>t.symbol);
        if(list.length){fill(sel,list);return;}
      }catch(e){}
    }
  };
  grab(REST.map(b=>b+'/api/v3/ticker/24hr'),'#symlist');
  grab([REST_F+'/fapi/v1/ticker/24hr'],'#symlistF');
}

/* ---------- Panel (una gráfica) ---------- */
class Panel{
  constructor(idx){
    this.idx=idx;
    this.cfg=state.panels[idx];
    if(this.cfg.market!=='futures') this.cfg.market='spot';
    this.data=[];
    this.reqId=0;
    this.ws=null;
    this.loadingMore=false;
    this.noMore=false;
    this.dec=2;
    this.dirty=true;
    this.sig='';
    this.pending=null;
    this.preview=null;
    this.drag=null;
    this.hoverId=null;
    this.snapMark=null;
    this.consumed=false;
    this.ow=0;this.oh=0;

    const root=document.createElement('div');
    root.className='panel';
    root.innerHTML=
      '<div class="phead">'+
        '<div class="grip" title="Arrastrar para reordenar la gráfica"><svg viewBox="0 0 10 16"><circle cx="3" cy="3" r="1.4"/><circle cx="7" cy="3" r="1.4"/><circle cx="3" cy="8" r="1.4"/><circle cx="7" cy="8" r="1.4"/><circle cx="3" cy="13" r="1.4"/><circle cx="7" cy="13" r="1.4"/></svg></div>'+
        '<input class="sym" list="symlist" spellcheck="false" autocomplete="off">'+
        '<div class="ivs">'+Object.keys(INTERVALS).map(i=>`<button data-iv="${i}">${i}</button>`).join('')+'</div>'+
        '<select class="ivsel" title="Temporalidad">'+Object.keys(INTERVALS).map(i=>`<option value="${i}">${i}</option>`).join('')+'</select>'+
        '<span class="last"></span>'+
        '<button class="mkt" title="Cambiar entre Spot y Futuros perpetuos">Spot</button>'+
        '<button class="inv" title="Invertir eje de precios (los números bajos arriba)"><svg viewBox="0 0 24 24"><path d="M8 4v16M4 8l4-4 4 4M16 20V4M12 16l4 4 4-4"/></svg></button>'+
        '<button class="clr" title="Borrar todos los dibujos de este par"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>'+
        '<button class="fsb" title="Pantalla completa"></button>'+
      '</div>'+
      '<div class="pbody"><div class="chart"></div><canvas class="ov"></canvas><div class="msg"></div></div>';
    this.root=root;
    gridEl.appendChild(root);
    this.symEl=$('.sym',root);
    this.lastEl=$('.last',root);
    this.body=$('.pbody',root);
    this.chartEl=$('.chart',root);
    this.canvas=$('.ov',root);
    this.ctx=this.canvas.getContext('2d');
    this.msgEl=$('.msg',root);

    const fmtDate=t=>{
      const iv=this.cfg.interval,d=new Date(t*1000);
      if(iv==='1M'||iv==='3M'||iv==='12M') return d.toLocaleDateString('es-ES',{month:'short',year:'numeric',timeZone:'UTC'});
      if(iv==='1d'||iv==='1w') return d.toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'});
      return d.toLocaleString('es-ES',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
    };
    this.chart=LightweightCharts.createChart(this.chartEl,{
      autoSize:true,
      layout:{background:{type:'solid',color:'#0c0f14'},textColor:'#8b95a5',fontSize:11},
      grid:{vertLines:{color:'#141a23'},horzLines:{color:'#141a23'}},
      crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
      rightPriceScale:{borderColor:'#1e2530'},
      timeScale:{
        borderColor:'#1e2530',timeVisible:true,secondsVisible:false,rightOffset:8,
        tickMarkFormatter:(time,type)=>{
          const d=new Date(time*1000),p=n=>String(n).padStart(2,'0');
          if(type===0) return String(d.getFullYear());
          if(type===1) return d.toLocaleString('es-ES',{month:'short'});
          if(type===2) return String(d.getDate());
          return p(d.getHours())+':'+p(d.getMinutes());
        }
      },
      localization:{timeFormatter:fmtDate}
    });
    this.series=this.chart.addCandlestickSeries({
      upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,
      wickUpColor:'#26a69a',wickDownColor:'#ef5350'
    });

    this.chart.priceScale('right').applyOptions({invertScale:!!this.cfg.inv});

    this.chart.timeScale().subscribeVisibleLogicalRangeChange(r=>{
      this.render();
      if(r&&r.from<20) this.loadMore();
    });

    this.ro=new ResizeObserver(()=>{
      const r=this.body.getBoundingClientRect();
      const dpr=window.devicePixelRatio||1;
      this.ow=Math.round(r.width);this.oh=Math.round(r.height);
      this.canvas.width=this.ow*dpr;this.canvas.height=this.oh*dpr;
      this.dirty=true;
    });
    this.ro.observe(this.body);

    // Cabecera
    this.symEl.value=this.cfg.symbol;
    this.symEl.addEventListener('focus',()=>this.symEl.select());
    this.symEl.addEventListener('change',()=>this.setSymbol(this.symEl.value));
    this.symEl.addEventListener('keydown',e=>{if(e.key==='Enter')this.symEl.blur();});
    $('.ivs',root).addEventListener('click',e=>{
      const b=e.target.closest('button[data-iv]');
      if(b) this.setInterval_(b.dataset.iv);
    });
    this.selEl=$('.ivsel',root);
    this.selEl.addEventListener('change',()=>this.setInterval_(this.selEl.value));
    this.fsEl=$('.fsb',root);
    $('.grip',root).addEventListener('pointerdown',e=>gripDown(this,e));
    this.fsEl.innerHTML=ICON_EXPAND;
    this.fsEl.addEventListener('click',()=>toggleSolo(this));
    this.mktEl=$('.mkt',root);
    this.mktEl.addEventListener('click',()=>{
      this.cfg.market=this.cfg.market==='futures'?'spot':'futures';
      save();this.syncHeader();this.load();
    });
    this.invEl=$('.inv',root);
    this.invEl.addEventListener('click',()=>{
      this.cfg.inv=!this.cfg.inv;
      this.chart.priceScale('right').applyOptions({invertScale:this.cfg.inv});
      this.invEl.classList.toggle('on',this.cfg.inv);
      save();this.dirty=true;
    });
    this.invEl.classList.toggle('on',!!this.cfg.inv);
    $('.clr',root).addEventListener('click',()=>{
      const n=drawingsOf(this.key).length;
      if(!n) return;
      if(confirm(`¿Borrar los ${n} dibujos de ${this.cfg.symbol}?`)){
        state.drawings[this.key]=[];
        invalidateAll();
      }
    });
    root.addEventListener('pointerdown',()=>setActive(this),true);

    // Interacción con dibujos (captura antes que la gráfica)
    const b=this.body;
    b.addEventListener('pointerdown',e=>this.onDown(e),true);
    b.addEventListener('mousedown',e=>{if(this.consumed) e.stopPropagation();},true);
    b.addEventListener('touchstart',e=>{
      if(this.consumed){e.stopPropagation();if(e.cancelable) e.preventDefault();}
    },{capture:true,passive:false});
    b.addEventListener('touchmove',e=>{
      if(this.consumed||this.drag){e.stopPropagation();if(e.cancelable) e.preventDefault();}
    },{capture:true,passive:false});
    b.classList.toggle('tool-on',tool!=='cursor');
    b.addEventListener('pointermove',e=>this.onMove(e));
    b.addEventListener('pointerup',e=>this.onUp(e));
    b.addEventListener('pointercancel',e=>this.onUp(e));
    b.addEventListener('pointerleave',()=>{if(this.snapMark){this.snapMark=null;this.dirty=true;}if(this.hoverId&&!this.drag){this.hoverId=null;this.dirty=true;}});

    this.syncHeader();
    this.load();
  }

  get key(){return this.cfg.symbol+(this.cfg.market==='futures'?':F':'');}

  destroy(){
    this.reqId++;
    this.closeWS();
    this.ro.disconnect();
    this.chart.remove();
    this.root.remove();
  }

  syncHeader(){
    this.symEl.value=this.cfg.symbol;
    const fut=this.cfg.market==='futures';
    this.symEl.setAttribute('list',fut?'symlistF':'symlist');
    this.mktEl.textContent=fut?'Fut':'Spot';
    this.selEl.value=this.cfg.interval;
    this.mktEl.classList.toggle('fut',fut);
    this.root.querySelectorAll('.ivs button').forEach(b=>b.classList.toggle('on',b.dataset.iv===this.cfg.interval));
  }
  setMsg(t,err){this.msgEl.textContent=t||'';this.msgEl.className='msg'+(err?' err':'');}

  setSymbol(raw){
    const s=normalizeSymbol(raw);
    if(!s){this.symEl.value=this.cfg.symbol;return;}
    this.symEl.value=s;
    if(s===this.cfg.symbol&&this.data.length) return;
    this.cfg.symbol=s;save();this.load();
  }
  setInterval_(iv){
    if(iv===this.cfg.interval) return;
    this.cfg.interval=iv;save();this.syncHeader();this.load();
  }

  /* --- carga de datos --- */
  async load(){
    const id=++this.reqId;
    this.closeWS();
    this.data=[];this.noMore=false;this.loadingMore=false;
    this.series.setData([]);
    this.lastEl.textContent='';
    this.hoverId=null;this.pending=null;this.preview=null;this.drag=null;
    this.setMsg('Cargando '+this.cfg.symbol+(this.cfg.market==='futures'?' (futuros)':'')+'…');
    this.dirty=true;
    try{
      const market=this.cfg.market;
      let kl;
      try{
        kl=await fetchKlines(this.cfg.symbol,this.cfg.interval,{market});
      }catch(e){
        const sym=this.cfg.symbol;
        const alt=market==='futures'?'1000'+sym:sym.replace(/^1000/,'');
        if(e.notFound&&alt!==sym){
          try{
            kl=await fetchKlines(alt,this.cfg.interval,{market});
            this.cfg.symbol=alt;save();this.syncHeader();
          }catch(e2){throw e;}
        }else throw e;
      }
      if(id!==this.reqId) return;
      if(!kl.length) throw new Error('Sin datos para este par');
      this.data=kl;
      this.noMore=kl.length<1000;
      const p=kl[kl.length-1].close;
      this.dec=Math.max(2,Math.min(10,4-Math.floor(Math.log10(p))));
      this.series.applyOptions({priceFormat:{type:'price',precision:this.dec,minMove:Math.pow(10,-this.dec)}});
      this.series.setData(kl);
      const n=kl.length;
      this.chart.timeScale().setVisibleLogicalRange({from:Math.max(0,n-120),to:n+6});
      this.setMsg('');
      this.updateLast();
      this.openWS(id);
      this.dirty=true;
    }catch(e){
      if(id!==this.reqId) return;
      this.setMsg((e&&e.message)||'Error al cargar',true);
    }
  }
  async loadMore(){
    if(this.loadingMore||this.noMore||!this.data.length) return;
    this.loadingMore=true;
    const id=this.reqId;
    try{
      const kl=await fetchKlines(this.cfg.symbol,this.cfg.interval,{market:this.cfg.market,endTime:this.data[0].time*1000-1});
      if(id!==this.reqId) return;
      if(!kl.length){this.noMore=true;return;}
      const range=this.chart.timeScale().getVisibleLogicalRange();
      this.data=kl.concat(this.data);
      this.series.setData(this.data);
      if(range) this.chart.timeScale().setVisibleLogicalRange({from:range.from+kl.length,to:range.to+kl.length});
      if(kl.length<1000) this.noMore=true;
      this.dirty=true;
    }catch(e){}
    finally{this.loadingMore=false;}
  }
  async refreshTail(id){
    try{
      const kl=await fetchKlines(this.cfg.symbol,this.cfg.interval,{market:this.cfg.market,limit:200});
      if(id!==this.reqId) return;
      kl.forEach(b=>this.applyBar(b));
    }catch(e){}
  }

  /* --- tiempo real --- */
  openWS(id){
    const stream=`${this.cfg.symbol.toLowerCase()}@kline_${AGG[this.cfg.interval]?'1M':this.cfg.interval}`;
    const connect=bi=>{
      if(id!==this.reqId) return;
      let ws;
      const list=WSS[this.cfg.market==='futures'?'futures':'spot'];
      try{ws=new WebSocket(`${list[bi%list.length]}/${stream}`);}catch(e){return;}
      this.ws=ws;
      ws.onmessage=ev=>{
        if(id!==this.reqId) return;
        try{
          const m=JSON.parse(ev.data);
          if(!m.k) return;
          const k=m.k;
          let bar={time:Math.floor(k.t/1000),open:+k.o,high:+k.h,low:+k.l,close:+k.c};
          if(AGG[this.cfg.interval]) bar=this.mergeAgg(bar);
          this.applyBar(bar);
        }catch(e){}
      };
      ws.onerror=()=>{try{ws.close();}catch(e){}};
      ws.onclose=()=>{
        if(this.ws!==ws||id!==this.reqId) return;
        setTimeout(()=>{
          if(this.ws!==ws||id!==this.reqId) return;
          this.refreshTail(id);
          connect(bi+1);
        },2000);
      };
    };
    connect(0);
  }
  closeWS(){
    if(this.ws){
      const w=this.ws;this.ws=null;
      w.onclose=null;w.onmessage=null;w.onerror=null;
      try{w.close();}catch(e){}
    }
  }
  mergeAgg(m){
    const gs=groupStart(m.time,this.cfg.interval);
    const last=this.data[this.data.length-1];
    if(last&&last.time===gs) return{time:gs,open:last.open,high:Math.max(last.high,m.high),low:Math.min(last.low,m.low),close:m.close};
    return{time:gs,open:m.open,high:m.high,low:m.low,close:m.close};
  }
  applyBar(bar){
    const d=this.data,last=d[d.length-1];
    if(last&&bar.time===last.time) d[d.length-1]=bar;
    else if(!last||bar.time>last.time) d.push(bar);
    else return;
    this.series.update(bar);
    this.updateLast();
    this.dirty=true;
  }
  updateLast(){
    const l=this.data[this.data.length-1];
    if(!l) return;
    this.lastEl.textContent=l.close.toFixed(this.dec);
    this.lastEl.className='last '+(l.close>=l.open?'up':'down');
  }

  /* --- conversión tiempo/precio <-> pantalla --- */
  logicalToTime(l){
    const d=this.data,n=d.length;if(!n) return 0;
    const iv=INTERVALS[this.cfg.interval];
    if(l<=0) return d[0].time+l*iv;
    if(l>=n-1) return d[n-1].time+(l-(n-1))*iv;
    const i=Math.floor(l),f=l-i;
    return d[i].time+(d[i+1].time-d[i].time)*f;
  }
  timeToLogical(t){
    const d=this.data,n=d.length;if(!n) return 0;
    const iv=INTERVALS[this.cfg.interval];
    if(t<=d[0].time) return (t-d[0].time)/iv;
    if(t>=d[n-1].time) return n-1+(t-d[n-1].time)/iv;
    let lo=0,hi=n-1;
    while(lo<hi){const mid=(lo+hi+1)>>1;if(d[mid].time<=t) lo=mid;else hi=mid-1;}
    return lo+(t-d[lo].time)/(d[lo+1].time-d[lo].time);
  }
  xOf(t){return this.chart.timeScale().logicalToCoordinate(this.timeToLogical(t));}
  yOf(p){return this.series.priceToCoordinate(p);}
  tOf(x){const l=this.chart.timeScale().coordinateToLogical(x);return l==null?null:this.logicalToTime(l);}
  pOf(y){return this.series.coordinateToPrice(y);}
  pt(x,y){
    if(!this.data.length) return null;
    const t=this.tOf(x),p=this.pOf(y);
    return(t==null||p==null)?null:{t:Math.round(t),p};
  }
  snapPt(x,y,e){
    const raw=this.pt(x,y);
    if(!raw) return null;
    const on=!!state.magnet!==!!(e&&(e.ctrlKey||e.metaKey));
    if(on){
      const l=this.chart.timeScale().coordinateToLogical(x),n=this.data.length;
      if(l!=null){
        const i=Math.round(l);
        if(i>=0&&i<n){
          const b=this.data[i];
          let best=null,bd=15;
          for(const v of [b.high,b.low,b.open,b.close]){
            const vy=this.yOf(v);
            if(vy==null) continue;
            const dd=Math.abs(vy-y);
            if(dd<bd){bd=dd;best={p:v,y:vy};}
          }
          const bx=this.xOf(b.time);
          if(best&&bx!=null) return{pt:{t:b.time,p:best.p},mark:{x:bx,y:best.y}};
        }
      }
    }
    return{pt:raw,mark:null};
  }
  pos(e){const r=this.body.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
  paneSize(){
    const ts=this.chart.timeScale();
    let psw=60,tsh=26;
    try{psw=this.chart.priceScale('right').width()||60;}catch(e){}
    try{if(typeof ts.height==='function') tsh=ts.height()||26;}catch(e){}
    return{w:this.ow-psw,h:this.oh-tsh,psw};
  }
  fmt(p){return p.toFixed(this.dec);}

  /* --- geometría y detección --- */
  screenPts(pts){
    const out=[];
    for(const q of pts){
      const x=this.xOf(q.t),y=this.yOf(q.p);
      if(x!=null&&y!=null) out.push({x,y});
    }
    return out;
  }
  fibGeom(d){
    const x1=this.xOf(d.p1.t),x2=this.xOf(d.p2.t),y1=this.yOf(d.p1.p),y2=this.yOf(d.p2.p);
    if(x1==null||x2==null||y1==null||y2==null) return null;
    const levels=[];
    for(const lv of state.fibLevels){
      const price=d.p2.p+(d.p1.p-d.p2.p)*lv;
      const y=this.yOf(price);
      if(y!=null) levels.push({lv,price,y});
    }
    return{x1,x2,y1,y2,xl:Math.min(x1,x2),xr:Math.max(x1,x2),levels};
  }
  hit(x,y){
    if(state.hideDrawings) return null;
    const list=drawingsOf(this.key);
    const k=this.touch?2.5:1;
    for(let i=list.length-1;i>=0;i--){
      const d=list[i];
      if(d.type==='h'){
        const yy=this.yOf(d.price);
        const x0=d.t!=null?this.xOf(d.t):-Infinity;
        if(yy!=null&&x0!=null&&x>=x0-6*k&&Math.abs(yy-y)<=6*k) return{d,part:'body'};
      }else if(d.type==='brush'){
        const pts=this.screenPts(d.pts),tol=Math.max(6,d.w/2+3)*k;
        for(let j=1;j<pts.length;j++){
          if(segDist(x,y,pts[j-1].x,pts[j-1].y,pts[j].x,pts[j].y)<=tol) return{d,part:'body'};
        }
      }else if(d.type==='fib'){
        const g=this.fibGeom(d);if(!g) continue;
        if(Math.hypot(x-g.x1,y-g.y1)<=9*k) return{d,part:'p1'};
        if(Math.hypot(x-g.x2,y-g.y2)<=9*k) return{d,part:'p2'};
        if(segDist(x,y,g.x1,g.y1,g.x2,g.y2)<=6*k) return{d,part:'body'};
        const xr=state.fibExt?Infinity:g.xr+6*k;
        if((state.fibExtL||x>=g.xl-6*k)&&x<=xr){
          for(const l of g.levels) if(Math.abs(l.y-y)<=6*k) return{d,part:'body'};
        }
      }
    }
    return null;
  }

  /* --- eventos --- */
  onDown(e){
    this.consumed=false;
    this.touch=e.pointerType==='touch';
    if(e.button!==0) return;
    const{x,y}=this.pos(e),ps=this.paneSize();
    setActive(this);
    if(x<0||y<0||x>ps.w||y>ps.h) return;
    let consume=false;
    const sym=this.key;

    if(tool==='cursor'){
      const h=this.hit(x,y);
      const l=this.chart.timeScale().coordinateToLogical(x),pt=this.pt(x,y);
      if(h&&l!=null&&pt){
        consume=true;
        this.drag={kind:'move',d:h.d,part:h.part,orig:JSON.parse(JSON.stringify(h.d)),startL:l,startP:pt.p,moved:false};
      }
    }else if(tool==='eraser'){
      consume=true;
      this.drag={kind:'erase',erased:false};
      this.eraseAt(x,y);
    }else if(tool==='h'){
      consume=true;
      const sp=this.snapPt(x,y,e),pt=sp&&sp.pt;
      if(pt) addDrawing(sym,{type:'h',t:pt.t,price:pt.p,color:state.color,w:state.width});
      setTool('cursor');
    }else if(tool==='fib'){
      consume=true;
      const sp=this.snapPt(x,y,e),pt=sp&&sp.pt;
      if(pt){
        if(!this.pending){
          this.pending={p1:pt,x0:x,y0:y,down:true};
          this.preview={type:'fib',p1:pt,p2:pt,color:state.color};
        }else{
          this.finishFib(pt);
        }
      }
    }else if(tool==='brush'){
      consume=true;
      const pt=this.pt(x,y);
      if(pt){
        this.preview={type:'brush',pts:[pt],color:state.color,w:state.width};
        this.drag={kind:'brush',lx:x,ly:y};
      }
    }

    if(consume){
      this.consumed=true;
      e.preventDefault();
      e.stopPropagation();
      try{this.body.setPointerCapture(e.pointerId);}catch(_){}
    }
  }
  onMove(e){
    const{x,y}=this.pos(e);
    if(this.drag){this.dragMove(x,y,e);return;}
    if(tool==='h'||tool==='fib'){
      const s=this.snapPt(x,y,e);
      this.snapMark=s?s.mark:null;
      if(tool==='fib'&&this.pending&&s) this.preview={type:'fib',p1:this.pending.p1,p2:s.pt,color:state.color};
      this.dirty=true;
      return;
    }
    const ps=this.paneSize();
    const inPane=x>=0&&y>=0&&x<=ps.w&&y<=ps.h;
    const h=(inPane&&(tool==='cursor'||tool==='eraser'))?this.hit(x,y):null;
    const id=h?h.d.id:null;
    if(id!==this.hoverId){this.hoverId=id;this.dirty=true;}
    this.setCursor(h);
  }
  onUp(e){
    const dr=this.drag;this.drag=null;
    if(dr){
      if(dr.kind==='move'){this.snapMark=null;this.dirty=true;if(dr.moved) save();}
      if(dr.kind==='erase'&&dr.erased) save();
      if(dr.kind==='brush'){
        const p=this.preview;this.preview=null;
        if(p&&p.pts.length>=2) addDrawing(this.key,{type:'brush',pts:this.smoothStroke(p.pts),color:p.color,w:p.w});
        this.dirty=true;
      }
    }
    if(tool==='fib'&&this.pending&&this.pending.down){
      const{x,y}=this.pos(e);
      if(Math.hypot(x-this.pending.x0,y-this.pending.y0)>6){
        const sp=this.snapPt(x,y,e),pt=sp&&sp.pt;
        if(pt) this.finishFib(pt);
      }else{
        this.pending.down=false;
      }
    }
    this.consumed=false;
  }
  smoothStroke(pts){
    if(pts.length<3||BRUSH_SMOOTH_PASSES<1) return pts;
    let sp=pts.map(q=>({x:this.xOf(q.t),y:this.yOf(q.p)}));
    if(sp.some(q=>q.x==null||q.y==null)) return pts;
    for(let pass=0;pass<BRUSH_SMOOTH_PASSES;pass++){
      const n=sp.length,out=[sp[0]];
      for(let i=1;i<n-1;i++){
        out.push({x:(sp[i-1].x+2*sp[i].x+sp[i+1].x)/4,y:(sp[i-1].y+2*sp[i].y+sp[i+1].y)/4});
      }
      out.push(sp[n-1]);
      sp=out;
    }
    const last=sp.length-1;
    return sp.map((q,i)=>(i===0||i===last)?pts[i]:(this.pt(q.x,q.y)||pts[i]));
  }
  finishFib(p2){
    addDrawing(this.key,{type:'fib',p1:this.pending.p1,p2,color:state.color});
    setTool('cursor');
  }
  eraseAt(x,y){
    const h=this.hit(x,y);
    if(!h) return;
    const list=drawingsOf(this.key);
    const i=list.indexOf(h.d);
    if(i>=0){
      list.splice(i,1);
      if(this.drag) this.drag.erased=true;
      this.hoverId=null;
      invalidateAll();
    }
  }
  dragMove(x,y,e){
    const dr=this.drag;
    if(dr.kind==='erase'){this.eraseAt(x,y);return;}
    if(dr.kind==='brush'){
      if(Math.hypot(x-dr.lx,y-dr.ly)<=2) return;
      const pt=this.pt(x,y);
      if(!pt) return;
      this.preview.pts.push(pt);
      dr.lx=x;dr.ly=y;this.dirty=true;
      return;
    }
    if(dr.kind==='move'){
      const pt=this.pt(x,y),l=this.chart.timeScale().coordinateToLogical(x);
      if(!pt||l==null) return;
      dr.moved=true;
      const d=dr.d,o=dr.orig,dL=l-dr.startL,dP=pt.p-dr.startP;
      const s=(d.type==='h'||(d.type==='fib'&&dr.part!=='body'))?this.snapPt(x,y,e):null;
      this.snapMark=s?s.mark:null;
      const shift=q=>({t:Math.round(this.logicalToTime(this.timeToLogical(q.t)+dL)),p:q.p+dP});
      if(d.type==='h'){
          d.price=(s&&s.mark)?s.pt.p:o.price+dP;
          if(o.t!=null) d.t=shift({t:o.t,p:0}).t;
        }
      else if(d.type==='brush') d.pts=o.pts.map(shift);
      else if(d.type==='fib'){
        if(dr.part==='p1') d.p1=s?s.pt:pt;
        else if(dr.part==='p2') d.p2=s?s.pt:pt;
        else{d.p1=shift(o.p1);d.p2=shift(o.p2);}
      }
      invalidateAll();
    }
  }
  setCursor(h){
    const c=this.body.classList;
    c.toggle('cur-cross',tool==='h'||tool==='fib'||tool==='brush');
    c.toggle('cur-move',tool==='cursor'&&!!h);
    c.toggle('cur-del',tool==='eraser');
  }

  /* --- dibujo sobre canvas --- */
  tick(){
    const r=this.chart.timeScale().getVisibleLogicalRange();
    const a=this.series.coordinateToPrice(0),b=this.series.coordinateToPrice(this.oh);
    const sig=[r&&r.from,r&&r.to,a,b,this.ow,this.oh].join('|');
    if(sig!==this.sig||this.dirty){this.sig=sig;this.dirty=false;this.render();}
  }
  render(){
    const ctx=this.ctx;
    if(!this.ow||!this.oh) return;
    const dpr=window.devicePixelRatio||1;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,this.ow,this.oh);
    if(!this.data.length) return;
    const ps=this.paneSize();
    const list=state.hideDrawings?[]:drawingsOf(this.key);
    ctx.save();
    ctx.beginPath();ctx.rect(0,0,ps.w,ps.h);ctx.clip();
    for(const d of list) this.drawOne(ctx,d,ps,d.id===this.hoverId);
    if(this.preview) this.drawOne(ctx,this.preview,ps,true);
    if(this.snapMark){
      ctx.setLineDash([]);ctx.lineWidth=1.5;
      ctx.strokeStyle='#ffffff';ctx.fillStyle='rgba(255,255,255,0.25)';
      ctx.beginPath();ctx.arc(this.snapMark.x,this.snapMark.y,5,0,Math.PI*2);ctx.fill();ctx.stroke();
    }
    ctx.restore();
    for(const d of list){
      if(d.type!=='h') continue;
      if(d.t!=null){const x0=this.xOf(d.t);if(x0==null||x0>ps.w) continue;}
      this.drawTag(ctx,d.price,d.color,ps);
    }
  }
  drawTag(ctx,price,color,ps){
    const y=this.yOf(price);
    if(y==null||y<0||y>ps.h) return;
    ctx.fillStyle=color;
    ctx.fillRect(ps.w,y-9,ps.psw,18);
    ctx.fillStyle=textOn(color);
    ctx.font='11px ui-monospace,Consolas,monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(this.fmt(price),ps.w+ps.psw/2,y+0.5);
  }
  drawOne(ctx,d,ps,hot){
    ctx.lineCap='round';ctx.lineJoin='round';ctx.setLineDash([]);
    if(d.type==='h'){
      const y=this.yOf(d.price);if(y==null) return;
      const x0=d.t!=null?this.xOf(d.t):0;
      if(x0==null) return;
      ctx.strokeStyle=d.color;ctx.lineWidth=d.w+(hot?1:0);
      ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(ps.w,y);ctx.stroke();
      if(hot&&d.t!=null){
        ctx.fillStyle=d.color;
        ctx.beginPath();ctx.arc(x0,y,3.5,0,Math.PI*2);ctx.fill();
      }
    }else if(d.type==='brush'){
      const pts=this.screenPts(d.pts);
      if(pts.length<2) return;
      ctx.strokeStyle=d.color;ctx.lineWidth=d.w+(hot?0.8:0);
      ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
      for(let i=1;i<pts.length-1;i++){
        const mx=(pts[i].x+pts[i+1].x)/2,my=(pts[i].y+pts[i+1].y)/2;
        ctx.quadraticCurveTo(pts[i].x,pts[i].y,mx,my);
      }
      ctx.lineTo(pts[pts.length-1].x,pts[pts.length-1].y);
      ctx.stroke();
    }else if(d.type==='fib'){
      const g=this.fibGeom(d);if(!g||!g.levels.length) return;
      const xl=state.fibExtL?Math.min(0,g.xl):g.xl,xr=state.fibExt?Math.max(ps.w,g.xr):g.xr;
      ctx.font='11px ui-monospace,Consolas,monospace';
      ctx.textAlign='left';ctx.textBaseline='bottom';
      for(const l of g.levels){
        ctx.strokeStyle=fibColor(l.lv);ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(xl,l.y);ctx.lineTo(xr,l.y);ctx.stroke();
        ctx.fillStyle=fibColor(l.lv);
        ctx.fillText(l.lv+'  ('+this.fmt(l.price)+')',xl+5,l.y-3);
      }
      if(hot){
        for(const[px,py] of [[g.x1,g.y1],[g.x2,g.y2]]){
          ctx.fillStyle='#0c0f14';ctx.strokeStyle='#ffffff';ctx.lineWidth=1.5;
          ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);ctx.fill();ctx.stroke();
        }
      }
    }
  }
}

/* ---------- Herramientas y barra superior ---------- */
function setTool(t){
  tool=t;
  document.querySelectorAll('#tools button[data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));
  if(t!=='cursor'&&state.hideDrawings) setHidden(false);
  $('#hint').textContent=HINTS[t]||'';
  live().forEach(p=>{
    p.pending=null;p.preview=null;p.drag=null;p.hoverId=null;p.snapMark=null;p.dirty=true;
    p.setCursor(null);
    p.body.classList.toggle('tool-on',t!=='cursor');
  });
}
$('#tools').addEventListener('click',e=>{
  const b=e.target.closest('button[data-tool]');
  if(b) setTool(b.dataset.tool);
});

function syncSolo(){
  gridEl.classList.toggle('solo',!!soloPanel);
  live().forEach(p=>{
    const on=p===soloPanel;
    p.root.classList.toggle('solo-panel',on);
    p.fsEl.innerHTML=on?ICON_COLLAPSE:ICON_EXPAND;
    p.fsEl.title=on?'Salir de pantalla completa':'Pantalla completa';
    p.dirty=true;
  });
}
function enterSolo(p){
  soloPanel=p;
  syncSolo();
  setActive(p);
  try{
    if(document.fullscreenEnabled&&!document.fullscreenElement){
      const r=document.documentElement.requestFullscreen();
      if(r&&r.catch) r.catch(()=>{});
    }
  }catch(e){}
}
function exitSolo(){
  soloPanel=null;
  syncSolo();
  try{
    if(document.fullscreenElement){
      const r=document.exitFullscreen();
      if(r&&r.catch) r.catch(()=>{});
    }
  }catch(e){}
}
function toggleSolo(p){ if(soloPanel===p) exitSolo(); else enterSolo(p); }
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement&&soloPanel) exitSolo();
});

/* ---------- Reordenar gráficas arrastrando ---------- */
const dropInd=document.createElement('div');
dropInd.id='dropInd';
document.body.appendChild(dropInd);
let dnd=null;
function gripDown(panel,e){
  if(e.button!==0||soloPanel||state.layout<2) return;
  e.preventDefault();e.stopPropagation();
  const grip=e.currentTarget;
  try{grip.setPointerCapture(e.pointerId);}catch(_){}
  dnd={panel,grip,id:e.pointerId,x0:e.clientX,y0:e.clientY,active:false,target:null,side:'left'};
  grip.addEventListener('pointermove',gripMove);
  grip.addEventListener('pointerup',gripUp);
  grip.addEventListener('pointercancel',endDnd);
}
function gripMove(e){
  if(!dnd) return;
  if(!dnd.active){
    if(Math.hypot(e.clientX-dnd.x0,e.clientY-dnd.y0)<5) return;
    dnd.active=true;
    dnd.panel.root.classList.add('dragging');
    document.documentElement.classList.add('dragging-panel');
  }
  let hit=null;
  for(const p of panels.slice(0,state.layout)){
    if(!p) continue;
    const r=p.root.getBoundingClientRect();
    if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){hit={p,r};break;}
  }
  if(!hit||hit.p===dnd.panel){dnd.target=null;dropInd.style.display='none';return;}
  const side=e.clientX<hit.r.left+hit.r.width/2?'left':'right';
  dnd.target=hit.p;dnd.side=side;
  Object.assign(dropInd.style,{display:'block',left:(side==='left'?hit.r.left:hit.r.right)+'px',top:hit.r.top+'px',height:hit.r.height+'px'});
}
function endDnd(){
  if(!dnd) return;
  const g=dnd.grip;
  g.removeEventListener('pointermove',gripMove);
  g.removeEventListener('pointerup',gripUp);
  g.removeEventListener('pointercancel',endDnd);
  try{g.releasePointerCapture(dnd.id);}catch(_){}
  dnd.panel.root.classList.remove('dragging');
  document.documentElement.classList.remove('dragging-panel');
  dropInd.style.display='none';
  dnd=null;
}
function gripUp(){
  if(!dnd) return;
  const d=dnd;
  endDnd();
  if(d.active&&d.target) movePanel(d.panel,d.target,d.side);
}
function movePanel(src,target,side){
  const n=state.layout;
  const arr=panels.slice(0,n);
  const from=arr.indexOf(src);
  if(from<0) return;
  arr.splice(from,1);
  const ti=arr.indexOf(target);
  if(ti<0) return;
  arr.splice(ti+(side==='right'?1:0),0,src);
  for(let i=0;i<n;i++){panels[i]=arr[i];arr[i].idx=i;}
  state.panels=arr.map(p=>p.cfg).concat(state.panels.slice(n));
  arr.forEach(p=>gridEl.appendChild(p.root));
  live().forEach(p=>{p.dirty=true;});
  save();
}

function buildGrid(){
  gridEl.className='g'+state.layout+(soloPanel?' solo':'');
  for(let i=0;i<6;i++){
    if(i<state.layout){
      if(!panels[i]) panels[i]=new Panel(i);
    }else if(panels[i]){
      panels[i].destroy();panels[i]=null;
    }
  }
  if(soloPanel&&!live().includes(soloPanel)) exitSolo();
  if(activePanel&&!live().includes(activePanel)) setActive(null);
  document.querySelectorAll('#layoutSeg button').forEach(b=>b.classList.toggle('on',+b.dataset.n===state.layout));
}
$('#layoutSeg').addEventListener('click',e=>{
  const b=e.target.closest('button[data-n]');
  if(!b) return;
  if(soloPanel) exitSolo();
  state.layout=+b.dataset.n;save();buildGrid();
});

// Colores y grosor
const swWrap=$('#swatches');
SWATCHES.forEach(c=>{
  const b=document.createElement('button');
  b.className='sw';b.style.background=c;b.dataset.c=c;b.title='Color';
  b.addEventListener('click',()=>{state.color=c;save();syncOpts();});
  swWrap.appendChild(b);
});
function syncOpts(){
  swWrap.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.c===state.color));
  $('#width').value=String(state.width);
  $('#fibExtR').checked=!!state.fibExt;
  $('#fibExtL').checked=!!state.fibExtL;
  $('#magnet').checked=!!state.magnet;
}
$('#width').addEventListener('change',e=>{state.width=+e.target.value;save();});
$('#magnet').addEventListener('change',e=>{state.magnet=e.target.checked;save();});
$('#fibExtR').addEventListener('change',e=>{state.fibExt=e.target.checked;invalidateAll();});
$('#fibExtL').addEventListener('change',e=>{state.fibExtL=e.target.checked;invalidateAll();});

/* ---------- Ocultar / mostrar dibujos ---------- */
const hideBtn=$('#hideBtn');
const ICON_EYE='<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICON_EYE_OFF='<svg viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.1A9.8 9.8 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 4"/><path d="M6.5 6.6A17 17 0 0 0 2 12s4 7 10 7a9.7 9.7 0 0 0 4.2-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
function syncHide(){
  hideBtn.innerHTML=state.hideDrawings?ICON_EYE_OFF:ICON_EYE;
  hideBtn.classList.toggle('on',!!state.hideDrawings);
  hideBtn.title=state.hideDrawings?'Mostrar dibujos':'Ocultar dibujos';
}
function setHidden(v){
  state.hideDrawings=!!v;
  save();
  syncHide();
  live().forEach(p=>{p.hoverId=null;p.dirty=true;});
}
hideBtn.addEventListener('click',()=>setHidden(!state.hideDrawings));

/* ---------- Editor de niveles Fibonacci ---------- */
const FIB_PRESETS={
  classic:[0,0.236,0.382,0.5,0.618,0.786,1],
  quarters:[0,0.25,0.5,0.75,1,1.25,1.5],
  ext:[0,0.236,0.382,0.5,0.618,0.786,1,1.272,1.618,2.618]
};
const fibPanel=$('#fibPanel'),fibInput=$('#fibInput'),fibErr=$('#fibErr'),fibBtn=$('#fibBtn');
function parseLevels(text){
  const norm=text.replace(/,\s+/g,' ').replace(/,+$/,'');
  const out=[];
  for(const tok of norm.split(/[;\s]+/)){
    if(!tok) continue;
    const parts=(tok.includes(',')&&tok.includes('.'))?tok.split(','):[tok.replace(',','.')];
    for(const p of parts){
      if(p==='') continue;
      const v=parseFloat(p);
      if(!isFinite(v)||!/^[-+]?\d*\.?\d+$/.test(p.trim())) return null;
      out.push(Math.round(v*10000)/10000);
    }
  }
  return Array.from(new Set(out)).sort((a,b)=>a-b);
}
function applyLevels(list){
  state.fibLevels=list;
  invalidateAll();
}
function showFibPanel(show){
  if(show){
    fibInput.value=state.fibLevels.join(' ');
    fibErr.textContent='';
    const r=fibBtn.getBoundingClientRect();
    fibPanel.style.top=(r.bottom+6)+'px';
    fibPanel.style.right=Math.max(8,window.innerWidth-r.right)+'px';
    fibPanel.hidden=false;
    fibBtn.classList.add('on');
    fibInput.focus();fibInput.select();
  }else{
    fibPanel.hidden=true;
    fibBtn.classList.remove('on');
  }
}
function submitLevels(){
  const list=parseLevels(fibInput.value);
  if(!list||list.length<2){fibErr.textContent='Escribe al menos 2 números válidos.';return;}
  if(list.length>30){fibErr.textContent='Máximo 30 niveles.';return;}
  applyLevels(list);
  showFibPanel(false);
}
fibBtn.addEventListener('click',()=>showFibPanel(fibPanel.hidden));
$('#fibApply').addEventListener('click',submitLevels);
fibInput.addEventListener('keydown',e=>{
  if(e.key==='Enter') submitLevels();
  else if(e.key==='Escape') showFibPanel(false);
});
fibPanel.addEventListener('click',e=>{
  const b=e.target.closest('button[data-preset]');
  if(!b) return;
  applyLevels(FIB_PRESETS[b.dataset.preset].slice());
  fibInput.value=state.fibLevels.join(' ');
  fibErr.textContent='';
});
document.addEventListener('pointerdown',e=>{
  if(!fibPanel.hidden&&!fibPanel.contains(e.target)&&e.target!==fibBtn) showFibPanel(false);
},true);

function undo(){
  if(state.hideDrawings) return;
  const p=activePanel||live()[0];
  if(!p) return;
  const list=drawingsOf(p.key);
  if(list.length){list.pop();invalidateAll();}
}
window.addEventListener('keydown',e=>{
  if(/INPUT|SELECT|TEXTAREA/.test((e.target&&e.target.tagName)||'')) return;
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();undo();return;}
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const map={v:'cursor',h:'h',f:'fib',b:'brush',e:'eraser'};
  if(map[k]) setTool(map[k]);
  else if(k==='escape'){
    if(tool!=='cursor') setTool('cursor');
    else if(soloPanel) exitSolo();
  }
});

/* ---------- Arranque ---------- */
function loop(){
  for(const p of panels) if(p) p.tick();
  requestAnimationFrame(loop);
}
syncOpts();
syncHide();
buildGrid();
setTool('cursor');
setActive(panels[0]||null);
loadSymbols();
requestAnimationFrame(loop);
})();
</script>
